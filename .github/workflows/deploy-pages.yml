name: Deploy Game A to GitHub Pages

# Deploy tĩnh miễn phí lên GitHub Pages.
# KÍCH HOẠT: chỉ chạy khi có người thật bấm "Run workflow" trong tab Actions,
# KHÔNG tự deploy khi push (tránh phát hành ngoài ý muốn).
# Trước khi chạy lần đầu: bật Settings > Pages > Source = "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install deps
        run: npm ci --include=dev

      - name: Run tests (53)
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
