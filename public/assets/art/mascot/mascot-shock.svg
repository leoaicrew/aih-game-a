<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="shock-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shock-glow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.8"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="148" rx="46" ry="9" fill="#030712" opacity="0.7"/>

  <!-- Antenna with crooked spark -->
  <line x1="80" y1="28" x2="80" y2="44" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="26" r="8" fill="#f43f5e" stroke="#94a3b8" stroke-width="2"/>

  <!-- Anime Big Blue Sweat Drop -->
  <path d="M 126 34 C 126 34, 136 46, 136 52 C 136 57.5, 131.5 62, 126 62 C 120.5 62, 116 57.5, 116 52 C 116 46, 126 34, 126 34 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="123" cy="50" r="2" fill="#ffffff"/>

  <!-- Mascot Body -->
  <rect x="30" y="44" width="100" height="96" rx="30" fill="url(#shock-body)" stroke="#94a3b8" stroke-width="3" filter="url(#shock-glow)"/>

  <!-- Screen Visor -->
  <rect x="42" y="60" width="76" height="58" rx="18" fill="#090d16" stroke="#475569" stroke-width="2"/>

  <!-- Spiral / Stunned Eyes (X or Spiral) -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Left X -->
    <line x1="54" y1="74" x2="70" y2="90"/>
    <line x1="70" y1="74" x2="54" y2="90"/>
    <!-- Right X -->
    <line x1="90" y1="74" x2="106" y2="90"/>
    <line x1="106" y1="74" x2="90" y2="90"/>
  </g>

  <!-- Blue blush of embarrassment -->
  <ellipse cx="50" cy="100" rx="6" ry="3" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="110" cy="100" rx="6" ry="3" fill="#38bdf8" opacity="0.6"/>

  <!-- O-shaped shocked mouth -->
  <ellipse cx="80" cy="98" rx="7" ry="9" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Trembling hands hugging face -->
  <circle cx="34" cy="94" r="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="126" cy="94" r="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
</svg>