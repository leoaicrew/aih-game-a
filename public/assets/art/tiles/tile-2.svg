<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Tile Gradient -->
    <linearGradient id="grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4a6b"/>
      <stop offset="100%" stop-color="#24314d"/>
    </linearGradient>
    <!-- Bevel Specular Top -->
    <linearGradient id="bevel-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#050814" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Drop Shadow Plate -->
  <rect x="8" y="10" width="112" height="112" rx="20" fill="none" filter="url(#shadow-2)"/>

  <!-- High-tier Aura / Glow Ring -->
  

  <!-- Main Tile Body -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#grad-2)" stroke="url(#bevel-2)" stroke-width="2.5"/>

  <!-- Inner Gloss Arc / Specular Pill -->
  <path d="M 16 26 C 16 16, 26 14, 40 14 L 88 14 C 102 14, 112 16, 112 26 C 112 36, 100 24, 86 24 L 42 24 C 28 24, 16 36, 16 26 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Bottom Inner Shadow for 3D Bevel depth -->
  <path d="M 12 104 C 20 114, 40 116, 64 116 C 88 116, 108 114, 116 104 C 112 110, 90 114, 64 114 C 38 114, 16 110, 12 104 Z" fill="#000000" opacity="0.45"/>

  <!-- Corner Tech Accent Dots for subtle Cyber Look -->
  <circle cx="18" cy="18" r="2" fill="#64748b" opacity="0.8"/>
  <circle cx="110" cy="18" r="2" fill="#64748b" opacity="0.8"/>
  <circle cx="18" cy="110" r="2" fill="#64748b" opacity="0.5"/>
  <circle cx="110" cy="110" r="2" fill="#64748b" opacity="0.5"/>

  <!-- Small Tier Category Badge at Top Right -->
  

  

  <!-- Number Text with 3D Offset & Glow -->
  <text x="64" y="78" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="50" fill="#000000" opacity="0.35" dy="3">2</text>
  <text x="64" y="76" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="50" fill="#f1f5f9">2</text>
</svg>