<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="flash-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#0891b2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>
    <filter id="flash-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Radiant Flash Core -->
  <rect x="10" y="10" width="108" height="108" rx="16" fill="#ffffff" />
  <circle cx="64" cy="64" r="58" fill="url(#flash-rad)" filter="url(#flash-blur)" />
  
  <!-- Starburst Rays -->
  <path d="M 64,8 L 68,54 L 114,64 L 68,74 L 64,120 L 60,74 L 14,64 L 60,54 Z" fill="#ffffff" opacity="0.95" />
  <circle cx="64" cy="64" r="14" fill="#ffffff" />
</svg>