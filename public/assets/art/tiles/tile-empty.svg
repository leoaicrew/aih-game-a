<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="empty-grad" x1="0.3" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5c7cae"/>
      <stop offset="100%" stop-color="#4a6a9c"/>
    </linearGradient>
  </defs>
  <!-- Inset recessed cell: crisp 2px border, no blur. -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#empty-grad)" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="3 5"/>
  <!-- Subtle center dot guide. -->
  <circle cx="64" cy="64" r="3" fill="#ffffff" opacity="0.3"/>
</svg>
