<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="sel-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22d3ee" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Reticle Brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M 112 36 L 112 16 L 92 16" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M 16 92 L 16 112 L 36 112" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M 112 92 L 112 112 L 92 112" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <!-- Glowing Selection Border -->
  <rect x="14" y="14" width="100" height="100" rx="18" fill="#22d3ee" fill-opacity="0.12" stroke="#67e8f9" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#sel-glow)"/>
  <!-- Corner indicator pulses -->
  <circle cx="16" cy="16" r="3" fill="#ffffff"/>
  <circle cx="112" cy="16" r="3" fill="#ffffff"/>
  <circle cx="16" cy="112" r="3" fill="#ffffff"/>
  <circle cx="112" cy="112" r="3" fill="#ffffff"/>
</svg>