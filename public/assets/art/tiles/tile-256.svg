<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad-256" x1="0.3" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#d08aff"/>
      <stop offset="100%" stop-color="#9a4fd6"/>
    </linearGradient>
  </defs>
  <!-- Crisp rounded body: solid fill + sharp 3px border. No blur filters. -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#grad-256)" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
  <!-- Single soft top highlight bar (crisp edge, low-opacity, no filter). -->
  <rect x="16" y="15" width="96" height="16" rx="8" fill="#ffffff" opacity="0.28"/>
  <!-- Bottom inner shade for depth (crisp, no filter). -->
  <rect x="14" y="103" width="100" height="9" rx="4.5" fill="#000000" opacity="0.14"/>
  <!-- High-tier accent ring. -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="none" stroke="#d08aff" stroke-width="1.5" opacity="0.9"/>
</svg>
