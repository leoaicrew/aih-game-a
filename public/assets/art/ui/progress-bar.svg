<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 28" width="360" height="28">
  <defs>
    <linearGradient id="prog-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>
    <filter id="prog-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22d3ee" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background Track -->
  <rect x="4" y="4" width="352" height="20" rx="10" fill="#0d1424" stroke="#1f2940" stroke-width="2"/>
  <!-- Progress Sample (70% fill) -->
  <rect x="6" y="6" width="246" height="16" rx="8" fill="url(#prog-fill)" filter="url(#prog-glow)"/>
  <!-- Specular Shine Top -->
  <path d="M 14 8 L 246 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Progress Pip Head -->
  <circle cx="250" cy="14" r="8" fill="#ffffff" stroke="#e9c46a" stroke-width="2"/>
</svg>