<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="btn-p-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="btn-p-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="btn-p-glow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0891b2" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Shadow & Glow Base -->
  <rect x="8" y="8" width="224" height="48" rx="24" fill="url(#btn-p-grad)" filter="url(#btn-p-glow)"/>
  <!-- Beveled Surface -->
  <rect x="8" y="8" width="224" height="48" rx="24" fill="url(#btn-p-grad)" stroke="url(#btn-p-border)" stroke-width="2"/>
  <!-- Top Specular Highlight Arc -->
  <path d="M 28 14 C 40 11, 80 11, 120 11 C 160 11, 200 11, 212 14 C 218 15, 200 22, 120 22 C 40 22, 22 15, 28 14 Z" fill="#ffffff" opacity="0.45"/>
  <!-- Bottom Lip for 3D depth -->
  <path d="M 32 52 C 70 55, 170 55, 208 52 C 196 54, 150 56, 120 56 C 90 56, 44 54, 32 52 Z" fill="#042f2e" opacity="0.6"/>
  <!-- Dual Side Tech Accents -->
  <circle cx="28" cy="32" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="212" cy="32" r="3" fill="#ffffff" opacity="0.8"/>
</svg>