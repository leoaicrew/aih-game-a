<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <defs>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f36"/>
      <stop offset="50%" stop-color="#101728"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="panel-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#2c3856"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#e9c46a"/>
    </linearGradient>
    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22d3ee" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Main Modal Container -->
  <rect x="16" y="16" width="388" height="488" rx="28" fill="url(#panel-bg)" stroke="url(#panel-border)" stroke-width="2.5" filter="url(#panel-shadow)"/>
  <!-- Top Banner Ridge -->
  <path d="M 28 32 C 28 24, 36 20, 50 20 L 370 20 C 384 20, 392 24, 392 32 L 392 48 L 28 48 Z" fill="#22d3ee" fill-opacity="0.08"/>
  <!-- Top Trim Glow Line -->
  <line x1="50" y1="20" x2="370" y2="20" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
  <!-- Header Separator -->
  <line x1="36" y1="84" x2="384" y2="84" stroke="#2c3856" stroke-width="1.5"/>
  <circle cx="210" cy="84" r="4" fill="#22d3ee"/>
  <!-- Bottom Tech Accents -->
  <line x1="160" y1="486" x2="260" y2="486" stroke="#e9c46a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="36" cy="476" r="3" fill="#2c3856"/>
  <circle cx="384" cy="476" r="3" fill="#2c3856"/>
</svg>