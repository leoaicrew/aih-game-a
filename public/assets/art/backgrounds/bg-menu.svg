<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800">
  <defs>
    <linearGradient id="menu-grad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#5a86db"/>
      <stop offset="40%" stop-color="#6f9fe6"/>
      <stop offset="72%" stop-color="#88c6ec"/>
      <stop offset="100%" stop-color="#b8ecf5"/>
    </linearGradient>
    <radialGradient id="menu-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c5f6ff" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#8fdcff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6f9fe6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="menu-gold-glow" cx="50%" cy="66%" r="42%">
      <stop offset="0%" stop-color="#ffe9a6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f4c66a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#88c6ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bright cosmic canvas -->
  <rect width="480" height="800" fill="url(#menu-grad)"/>

  <!-- Cyber ray angles -->
  <path d="M 0 0 L 280 0 L 0 560 Z" fill="#ffffff" fill-opacity="0.06"/>
  <path d="M 480 800 L 200 800 L 480 240 Z" fill="#ffe9a6" fill-opacity="0.08"/>

  <!-- Logo aura radial -->
  <circle cx="240" cy="260" r="220" fill="url(#menu-glow)"/>
  <!-- CTA aura radial -->
  <circle cx="240" cy="540" r="180" fill="url(#menu-gold-glow)"/>

  <!-- Tech hexagons in background -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.28" fill="none">
    <polygon points="240,110 270,126 270,158 240,174 210,158 210,126"/>
    <polygon points="120,240 145,254 145,282 120,296 95,282 95,254"/>
    <polygon points="360,240 385,254 385,282 360,296 335,282 335,254"/>
    <polygon points="240,410 260,421 260,443 240,454 220,443 220,421"/>
  </g>

  <!-- Speed rays -->
  <g stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3">
    <line x1="80" y1="120" x2="160" y2="40"/>
    <line x1="400" y1="140" x2="340" y2="60"/>
    <line x1="60" y1="620" x2="140" y2="700"/>
    <line x1="420" y1="600" x2="340" y2="680"/>
  </g>
</svg>
