<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800">
  <defs>
    <linearGradient id="bg-sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#4f7fd6"/>
      <stop offset="38%" stop-color="#5b8fe0"/>
      <stop offset="72%" stop-color="#6fa8e8"/>
      <stop offset="100%" stop-color="#8fd0ef"/>
    </linearGradient>
    <radialGradient id="nebula-cyan" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#aef1ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#67e8f9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5b8fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-gold" cx="50%" cy="88%" r="46%">
      <stop offset="0%" stop-color="#ffe8a8" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#f4c66a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6fa8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="70%">
      <stop offset="60%" stop-color="#0b2a4a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b2a4a" stop-opacity="0.28"/>
    </radialGradient>
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12"/>
      <circle cx="40" cy="40" r="1.1" fill="#ffffff" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Bright daylight-sky base -->
  <rect width="480" height="800" fill="url(#bg-sky)"/>

  <!-- Soft constellation grid -->
  <rect width="480" height="800" fill="url(#tech-grid)"/>

  <!-- Upper cyan glow behind board -->
  <rect width="480" height="800" fill="url(#nebula-cyan)"/>
  <!-- Lower gold hearth glow -->
  <rect width="480" height="800" fill="url(#nebula-gold)"/>

  <!-- Ambient light streaks & tech accents -->
  <g opacity="0.35" stroke="#ffffff" stroke-width="1.2" fill="none">
    <polygon points="40,120 55,110 70,120 70,138 55,148 40,138"/>
    <polygon points="410,240 425,230 440,240 440,258 425,268 410,258"/>
    <polygon points="50,680 62,672 74,680 74,694 62,702 50,694"/>
    <line x1="20" y1="200" x2="100" y2="200" stroke-dasharray="4 6"/>
    <line x1="380" y1="620" x2="460" y2="620" stroke-dasharray="4 6"/>
  </g>

  <!-- Star points -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="68" cy="85" r="1.8"/>
    <circle cx="395" cy="115" r="1.4"/>
    <circle cx="420" cy="90" r="2"/>
    <circle cx="95" cy="310" r="1.2"/>
    <circle cx="380" cy="440" r="1.6"/>
    <circle cx="80" cy="540" r="1.4"/>
    <circle cx="410" cy="710" r="1.8"/>
    <circle cx="120" cy="750" r="1.4"/>
  </g>

  <!-- Light vignette (kept subtle so the board stays bright) -->
  <rect width="480" height="800" fill="url(#vignette)"/>
</svg>
