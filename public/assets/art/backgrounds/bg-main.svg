<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800">
  <defs>
    <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="45%" stop-color="#12182b"/>
      <stop offset="100%" stop-color="#1a2238"/>
    </linearGradient>
    <radialGradient id="nebula-cyan" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-gold" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#e9c46a" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#b8933f" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0.75"/>
    </radialGradient>
    <!-- Pattern definition: futuristic isometric constellation grid -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.07"/>
      <circle cx="40" cy="40" r="1" fill="#67e8f9" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Deep Night Sky Base -->
  <rect width="480" height="800" fill="url(#bg-sky)"/>

  <!-- Constellation Tech Grid Pattern -->
  <rect width="480" height="800" fill="url(#tech-grid)"/>

  <!-- Upper Cyan Center Glow behind board -->
  <rect width="480" height="800" fill="url(#nebula-cyan)"/>
  <!-- Lower Gold Hearth Glow -->
  <rect width="480" height="800" fill="url(#nebula-gold)"/>

  <!-- Ambient Light Streaks & Tech Hex Accents -->
  <g opacity="0.15" stroke="#22d3ee" stroke-width="1" fill="none">
    <polygon points="40,120 55,110 70,120 70,138 55,148 40,138"/>
    <polygon points="410,240 425,230 440,240 440,258 425,268 410,258"/>
    <polygon points="50,680 62,672 74,680 74,694 62,702 50,694"/>
    <line x1="20" y1="200" x2="100" y2="200" stroke-dasharray="4 6"/>
    <line x1="380" y1="620" x2="460" y2="620" stroke-dasharray="4 6"/>
  </g>

  <!-- Star points -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="68" cy="85" r="1.5"/>
    <circle cx="395" cy="115" r="1.2"/>
    <circle cx="420" cy="90" r="1.8"/>
    <circle cx="95" cy="310" r="1"/>
    <circle cx="380" cy="440" r="1.4"/>
    <circle cx="80" cy="540" r="1.2"/>
    <circle cx="410" cy="710" r="1.6"/>
    <circle cx="120" cy="750" r="1.2"/>
  </g>

  <!-- Vignette Perimeter Shade -->
  <rect width="480" height="800" fill="url(#vignette)"/>
</svg>