  <polygon points="32,10 36.5,23 50,18.5 41,29 52,38 38,38 32,52 26,38 12,38 23,29 14,18.5 27.5,23" fill="url(#ic-star-grad)" stroke="#ffffff" stroke-width="1.5" filter="url(#ic-star-glow)"/>
