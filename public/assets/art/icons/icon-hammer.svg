<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ic-ham-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="ic-ham-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22d3ee" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <g transform="rotate(-35 32 32)">
    <!-- Shaft -->
    <rect x="29" y="22" width="6" height="28" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <!-- Cyber Hammer Head -->
    <rect x="18" y="14" width="28" height="14" rx="4" fill="url(#ic-ham-head)" stroke="#67e8f9" stroke-width="1.5" filter="url(#ic-ham-glow)"/>
    <!-- Energy Core on Hammer Head -->
    <line x1="22" y1="21" x2="42" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>