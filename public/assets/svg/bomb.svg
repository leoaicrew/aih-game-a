<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ic-bomb-body" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="ic-spark-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="18" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <!-- Bomb Sphere -->
  <circle cx="30" cy="36" r="16" fill="url(#ic-bomb-body)" stroke="#f43f5e" stroke-width="2"/>
  <ellipse cx="25" cy="29" rx="5" ry="3" fill="#ffffff" opacity="0.4" transform="rotate(-30 25 29)"/>
  <!-- Cap & Fuse -->
  <rect x="26" y="17" width="8" height="5" rx="1.5" fill="#94a3b8"/>
  <path d="M 30 17 Q 38 10 46 16" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spark -->
  <polygon points="46,16 49,12 51,17 55,16 52,20 54,24 49,21 46,24 47,19" fill="#fef08a" filter="url(#ic-spark-glow)"/>
</svg>